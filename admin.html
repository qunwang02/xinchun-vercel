<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>护持项目管理后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #7f8c8d; font-size: 16px; }

        .server-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .status-connected { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-disconnected { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-connecting { background-color: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn i { margin-right: 5px; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-info { background-color: #17a2b8; color: white; }
        .btn-info:hover { background-color: #138496; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-secondary:hover { background-color: #7f8c8d; }

        .filters-panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #6c757d;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .filter-item { flex: 1; min-width: 200px; }

        .filter-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 12px 8px;
            font-weight: 600;
            border: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 8px;
            border: 1px solid #ddd;
            vertical-align: top;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f8ff; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .page-btn.active { background-color: #3498db; color: white; border-color: #3498db; }
        .page-btn:hover:not(.active) { background-color: #f8f9fa; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .stats-panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .stat-card {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 5px 0;
        }

        .stat-label { font-size: 14px; color: #6c757d; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title { font-size: 20px; color: #2c3e50; }

        .close-modal {
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .close-modal:hover { color: #e74c3c; }

        .modal-footer {
            text-align: right;
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .detail-row {
            display: flex;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .detail-label { font-weight: 600; min-width: 150px; color: #495057; }
        .detail-value { flex: 1; word-break: break-word; }

        .log-panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border: 1px solid #dee2e6;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-panel h4 { color: #495057; margin-bottom: 10px; }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-family: monospace;
            font-size: 12px;
        }

        .log-success { color: #28a745; }
        .log-error { color: #dc3545; }
        .log-info { color: #17a2b8; }
        .log-warning { color: #ffc107; }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .admin-actions, .filter-group { flex-direction: column; }
            .filter-item { min-width: 100%; }
            th, td { padding: 8px 5px; font-size: 12px; }
            table { font-size: 12px; }
            .btn { width: 100%; margin-bottom: 5px; }
        }

        .view-detail {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .view-detail:hover { background-color: #5a6268; }

        .export-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .chart-container {
            height: 300px;
            margin-bottom: 20px;
        }

        /* 登录遮罩 */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(44, 62, 80, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-error {
            color: #e74c3c;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 10px;
        }

        .login-box .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- 登录遮罩 -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> 管理后台登录</h2>
            <p>请输入管理员密码</p>
            <input type="password" id="loginPassword" placeholder="管理员密码" autocomplete="current-password">
            <div class="login-error" id="loginError"></div>
            <button id="loginBtn" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display:none;">
        <header>
            <h1><i class="fas fa-database"></i> 护持项目管理后台</h1>
            <p class="subtitle">数据查看、管理和分析系统</p>
            <div id="serverStatus" class="server-status status-disconnected">
                <i class="fas fa-server"></i> 服务器: 未连接
            </div>
        </header>

        <!-- 统计面板 -->
        <div class="stats-panel" id="statsPanel">
            <h3><i class="fas fa-chart-bar"></i> 数据统计</h3>
            <div class="stats-grid" id="statsGrid">
                <div class="loading">加载统计信息...</div>
            </div>
        </div>

        <!-- 图表容器 -->
        <div class="chart-container">
            <canvas id="statsChart"></canvas>
        </div>

        <!-- 管理员操作面板 -->
        <div class="admin-actions">
            <button id="refreshData" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> 刷新数据
            </button>
            <button id="exportCSV" class="btn btn-success">
                <i class="fas fa-file-csv"></i> 导出CSV
            </button>
            <button id="exportJSON" class="btn btn-info">
                <i class="fas fa-file-code"></i> 导出JSON
            </button>
            <button id="showCharts" class="btn btn-warning">
                <i class="fas fa-chart-pie"></i> 查看图表
            </button>
            <button id="showLogs" class="btn btn-secondary">
                <i class="fas fa-clipboard-list"></i> 查看日志
            </button>
            <button id="editProjects" class="btn btn-warning">
                <i class="fas fa-edit"></i> 维护活动项目
            </button>
            <button id="clearFilters" class="btn btn-secondary">
                <i class="fas fa-filter"></i> 清除筛选
            </button>
            <button id="backToForm" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> 返回填写表单
            </button>
            <button id="logoutBtn" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> 退出登录
            </button>
        </div>

        <!-- 筛选面板 -->
        <div class="filters-panel">
            <h3><i class="fas fa-filter"></i> 数据筛选</h3>
            <div class="filter-group">
                <div class="filter-item">
                    <label>搜索（姓名/联系人/内容）:</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="输入关键词搜索">
                </div>
                <div class="filter-item">
                    <label>护持项目:</label>
                    <select id="projectFilter" class="form-control">
                        <option value="">全部项目</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>缴费状态:</label>
                    <select id="paymentFilter" class="form-control">
                        <option value="">全部状态</option>
                        <option value="未缴费">未缴费</option>
                        <option value="已缴费">已缴费</option>
                        <option value="随喜">随喜</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>开始日期:</label>
                    <input type="date" id="startDate" class="form-control">
                </div>
                <div class="filter-item">
                    <label>结束日期:</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
                <div class="filter-item">
                    <button id="applyFilters" class="btn btn-primary">
                        <i class="fas fa-search"></i> 应用筛选
                    </button>
                </div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container">
            <div class="loading" id="tableLoading">加载数据中...</div>
            <table id="donationTable" style="display: none;">
                <thead>
                    <tr>
                        <th width="3%">序号</th>
                        <th width="8%">姓名</th>
                        <th width="12%">护持项目</th>
                        <th width="15%">祈福方式</th>
                        <th width="10%">金额(新台币)</th>
                        <th width="10%">金额(人民币)</th>
                        <th width="8%">祈福内容</th>
                        <th width="6%">缴费状态</th>
                        <th width="8%">联系人</th>
                        <th width="12%">提交时间</th>
                        <th width="8%">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- 分页控件 -->
        <div class="pagination" id="pagination" style="display: none;"></div>

        <!-- 操作日志面板 -->
        <div class="log-panel" id="logPanel" style="display: none;">
            <h4><i class="fas fa-clipboard-list"></i> 操作日志</h4>
            <div id="logContent"></div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-info-circle"></i> 数据详情</div>
                <div class="close-modal" id="closeDetailModal">&times;</div>
            </div>
            <div class="modal-body" id="detailContent"></div>
            <div class="modal-footer">
                <button id="closeDetailBtn" class="btn btn-secondary">关闭</button>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-exclamation-triangle"></i> 确认删除</div>
                <div class="close-modal" id="closeDeleteModal">&times;</div>
            </div>
            <div class="modal-body">
                <p>您确定要删除这条记录吗？此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button id="confirmDelete" class="btn btn-danger">确认删除</button>
                <button id="cancelDelete" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <!-- 活动项目维护模态框 -->
    <div id="configEditorModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-edit"></i> 维护活动项目</div>
                <div class="close-modal" id="closeConfigEditor">&times;</div>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:10px; color:#6c757d; font-size:13px;">
                    格式：JSON。<code>projects</code> 下每个键为项目名，值为 <code>{method, amount}</code>。
                    <code>amount</code> 为 "随喜" 或数字字符串。<code>exchangeRate</code> 为默认汇率。
                </p>
                <textarea id="configEditor" style="width:100%; height:400px; font-family:monospace; font-size:13px; padding:10px; border:1px solid #ddd; border-radius:5px; resize:vertical;"></textarea>
                <div id="configEditorMsg" style="margin-top:8px; min-height:18px; font-size:13px;"></div>
            </div>
            <div class="modal-footer">
                <button id="saveConfigBtn" class="btn btn-success"><i class="fas fa-save"></i> 保存配置</button>
                <button id="cancelConfigBtn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 全局变量 ============
        let currentPage = 1;
        let currentLimit = 50;
        let currentSort = 'submittedAt';
        let currentOrder = 'desc';
        let currentFilters = {};
        let currentData = [];
        let currentStats = {};
        let serverUrl = window.location.origin;
        let chartInstance = null;

        // ============ 登录会话 ============
        const ADMIN_SESSION_KEY = 'admin_session_token';
        const ADMIN_PWD_KEY = 'admin_pwd';
        const SESSION_DURATION = 2 * 60 * 60 * 1000; // 2小时

        function isLoggedIn() {
            const token = sessionStorage.getItem(ADMIN_SESSION_KEY);
            if (!token) return false;
            try {
                const data = JSON.parse(atob(token));
                return Date.now() < data.exp;
            } catch { return false; }
        }

        function getAdminPassword() {
            return sessionStorage.getItem(ADMIN_PWD_KEY) || '';
        }

        function showAdminContent() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        async function doLogin() {
            const pwd = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            if (!pwd) { errEl.textContent = '请输入密码'; return; }

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const data = await res.json();
                if (data.success) {
                    const token = btoa(JSON.stringify({ exp: Date.now() + SESSION_DURATION }));
                    sessionStorage.setItem(ADMIN_SESSION_KEY, token);
                    sessionStorage.setItem(ADMIN_PWD_KEY, pwd);
                    showAdminContent();
                    initAdminPage();
                } else {
                    errEl.textContent = data.error || '密码错误';
                }
            } catch (e) {
                errEl.textContent = '登录失败: ' + e.message;
            }
        }

        function logout() {
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            sessionStorage.removeItem(ADMIN_PWD_KEY);
            location.reload();
        }

        // ============ 初始化 ============
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('loginPassword').addEventListener('keypress', e => {
                if (e.key === 'Enter') doLogin();
            });

            if (isLoggedIn()) {
                showAdminContent();
                initAdminPage();
            } else {
                showLogin();
            }
        });

        function initAdminPage() {
            initializePage();
            setupEventListeners();
            testServerConnection();
            loadData();
            loadStats();
        }

        async function initializePage() {
            // 动态加载项目筛选
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data.success && data.config && data.config.projects) {
                    const projectFilter = document.getElementById('projectFilter');
                    projectFilter.innerHTML = '<option value="">全部项目</option>';
                    Object.keys(data.config.projects).forEach(project => {
                        const option = document.createElement('option');
                        option.value = project;
                        option.textContent = project;
                        projectFilter.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('加载活动配置失败', e);
            }

            // 默认日期范围（最近30天）
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 30);
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
        }

        // ============ 事件绑定 ============
        function setupEventListeners() {
            document.getElementById('refreshData').addEventListener('click', loadData);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);
            document.getElementById('exportJSON').addEventListener('click', exportJSON);
            document.getElementById('showCharts').addEventListener('click', toggleCharts);
            document.getElementById('showLogs').addEventListener('click', toggleLogs);
            document.getElementById('clearFilters').addEventListener('click', clearFilters);
            document.getElementById('applyFilters').addEventListener('click', applyFilters);
            document.getElementById('backToForm').addEventListener('click', backToForm);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('editProjects').addEventListener('click', openConfigEditor);

            document.getElementById('closeDetailModal').addEventListener('click', closeDetailModal);
            document.getElementById('closeDetailBtn').addEventListener('click', closeDetailModal);
            document.getElementById('closeDeleteModal').addEventListener('click', closeDeleteModal);
            document.getElementById('cancelDelete').addEventListener('click', closeDeleteModal);
            document.getElementById('confirmDelete').addEventListener('click', confirmDelete);

            document.getElementById('closeConfigEditor').addEventListener('click', closeConfigEditor);
            document.getElementById('cancelConfigBtn').addEventListener('click', closeConfigEditor);
            document.getElementById('saveConfigBtn').addEventListener('click', saveConfigEditor);

            document.getElementById('detailModal').addEventListener('click', function(e) {
                if (e.target === this) closeDetailModal();
            });
            document.getElementById('deleteModal').addEventListener('click', function(e) {
                if (e.target === this) closeDeleteModal();
            });
            document.getElementById('configEditorModal').addEventListener('click', function(e) {
                if (e.target === this) closeConfigEditor();
            });

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') applyFilters();
            });
        }

        // ============ 服务器连接 ============
        async function testServerConnection() {
            updateServerStatus('connecting', '连接中...');
            try {
                const response = await fetch(`${serverUrl}/api/test`);
                if (response.ok) {
                    updateServerStatus('connected', '已连接');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                updateServerStatus('disconnected', '连接失败');
                console.error('服务器连接失败:', error);
            }
        }

        function updateServerStatus(status, message) {
            const statusElement = document.getElementById('serverStatus');
            statusElement.className = `server-status status-${status}`;
            const icon = status === 'connected' ? 'fa-check-circle' :
                        status === 'connecting' ? 'fa-sync fa-spin' : 'fa-times-circle';
            statusElement.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
        }

        // ============ 加载数据 ============
        async function loadData() {
            showTableLoading();
            const params = new URLSearchParams({
                page: currentPage,
                limit: currentLimit,
                sortBy: currentSort,
                sortOrder: currentOrder,
                ...currentFilters
            });

            try {
                const response = await fetch(`${serverUrl}/api/donations?${params}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    currentStats = result.stats;
                    renderTable(currentData);
                    renderPagination(result.pagination);
                    hideTableLoading();
                    addLog(`加载了 ${result.data.length} 条数据`, 'info');
                } else {
                    throw new Error(result.error || '加载数据失败');
                }
            } catch (error) {
                console.error('加载数据错误:', error);
                showTableError('加载数据失败: ' + error.message);
                addLog(`加载数据失败: ${error.message}`, 'error');
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${serverUrl}/api/stats`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                if (result.success) {
                    updateStatsPanel(result);
                    createChart(result);
                }
            } catch (error) {
                console.error('加载统计数据错误:', error);
            }
        }

        function updateStatsPanel(statsData) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">总记录数</div>
                    <div class="stat-value">${statsData.overall.totalRecords.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总金额(新台币)</div>
                    <div class="stat-value">NT$ ${statsData.overall.totalAmountTWD.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总金额(人民币)</div>
                    <div class="stat-value">¥ ${statsData.overall.totalAmountRMB.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均金额(新台币)</div>
                    <div class="stat-value">NT$ ${statsData.overall.avgAmountTWD.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">项目种类</div>
                    <div class="stat-value">${statsData.byProject.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最后更新</div>
                    <div class="stat-value" style="font-size: 16px;">${new Date(statsData.lastUpdated).toLocaleString('zh-TW')}</div>
                </div>
            `;
        }

        function createChart(statsData) {
            const ctx = document.getElementById('statsChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const projectLabels = statsData.byProject.map(p => p._id.substring(0, 15) + (p._id.length > 15 ? '...' : ''));
            const projectCounts = statsData.byProject.map(p => p.count);
            const projectAmounts = statsData.byProject.map(p => p.totalAmountTWD);

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: projectLabels,
                    datasets: [
                        {
                            label: '项目数量',
                            data: projectCounts,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            label: '金额(新台币)',
                            data: projectAmounts,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: '数量' }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '金额(新台币)' },
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        title: { display: true, text: '护持项目统计' }
                    }
                }
            });
        }

        function toggleCharts() {
            const chartContainer = document.querySelector('.chart-container');
            chartContainer.style.display = chartContainer.style.display === 'none' ? 'block' : 'none';
        }

        function toggleLogs() {
            const logPanel = document.getElementById('logPanel');
            logPanel.style.display = logPanel.style.display === 'none' ? 'block' : 'none';
        }

        // ============ 渲染表格 ============
        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="11" style="text-align: center; padding: 20px; color: #6c757d;">
                            <i class="fas fa-inbox"></i> 暂无数据
                        </td>
                    </tr>
                `;
                document.getElementById('donationTable').style.display = 'table';
                return;
            }

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                const submitDate = item.submittedAt ? new Date(item.submittedAt).toLocaleString('zh-TW') : '-';
                const amountTWD = item.amountTWD ? `NT$ ${item.amountTWD.toLocaleString()}` : '-';
                const amountRMB = item.amountRMB ? `¥ ${item.amountRMB.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : '-';

                const truncateText = (text, maxLength = 30) => {
                    if (!text) return '-';
                    return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
                };

                row.innerHTML = `
                    <td>${(currentPage - 1) * currentLimit + index + 1}</td>
                    <td>${item.name || '-'}</td>
                    <td>${item.project || '-'}</td>
                    <td>${truncateText(item.method, 50)}</td>
                    <td style="text-align: right;">${amountTWD}</td>
                    <td style="text-align: right;">${amountRMB}</td>
                    <td>${truncateText(item.content)}</td>
                    <td>
                        <span style="padding: 3px 8px; border-radius: 3px; font-size: 12px;
                              background-color: ${item.payment === '已缴费' ? '#d4edda' :
                                               item.payment === '未缴费' ? '#f8d7da' : '#fff3cd'};
                              color: ${item.payment === '已缴费' ? '#155724' :
                                      item.payment === '未缴费' ? '#721c24' : '#856404'}">
                            ${item.payment || '未缴费'}
                        </span>
                    </td>
                    <td>${item.contact || '-'}</td>
                    <td>${submitDate}</td>
                    <td>
                        <button class="view-detail" data-id="${item._id || item.localId}">
                            <i class="fas fa-eye"></i> 查看
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            document.querySelectorAll('.view-detail').forEach(button => {
                button.addEventListener('click', function() {
                    const itemId = this.getAttribute('data-id');
                    showDetailModal(itemId);
                });
            });

            document.getElementById('donationTable').style.display = 'table';
        }

        function renderPagination(pagination) {
            const paginationElement = document.getElementById('pagination');
            if (pagination.totalPages <= 1) {
                paginationElement.style.display = 'none';
                return;
            }
            paginationElement.style.display = 'flex';

            let paginationHTML = '';
            const maxPagesToShow = 5;
            const halfMax = Math.floor(maxPagesToShow / 2);
            let startPage = Math.max(1, currentPage - halfMax);
            let endPage = Math.min(pagination.totalPages, startPage + maxPagesToShow - 1);
            if (endPage - startPage + 1 < maxPagesToShow) {
                startPage = Math.max(1, endPage - maxPagesToShow + 1);
            }

            paginationHTML += `<button class="page-btn prev-btn" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

            if (startPage > 1) {
                paginationHTML += `<button class="page-btn" data-page="1">1</button>`;
                if (startPage > 2) paginationHTML += `<span class="page-btn" style="border: none; background: none;">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            if (endPage < pagination.totalPages) {
                if (endPage < pagination.totalPages - 1) paginationHTML += `<span class="page-btn" style="border: none; background: none;">...</span>`;
                paginationHTML += `<button class="page-btn" data-page="${pagination.totalPages}">${pagination.totalPages}</button>`;
            }

            paginationHTML += `<button class="page-btn next-btn" ${currentPage === pagination.totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
            paginationElement.innerHTML = paginationHTML;

            document.querySelectorAll('.page-btn:not(.prev-btn):not(.next-btn)').forEach(button => {
                if (!button.disabled) {
                    button.addEventListener('click', function() {
                        const page = parseInt(this.getAttribute('data-page'));
                        if (page !== currentPage) { currentPage = page; loadData(); }
                    });
                }
            });

            document.querySelector('.prev-btn').addEventListener('click', function() {
                if (currentPage > 1) { currentPage--; loadData(); }
            });
            document.querySelector('.next-btn').addEventListener('click', function() {
                if (currentPage < pagination.totalPages) { currentPage++; loadData(); }
            });
        }

        // ============ 详情模态框 ============
        async function showDetailModal(itemId) {
            const item = currentData.find(d => d._id === itemId || d.localId === itemId || d.serverId === itemId);
            if (item) {
                displayItemDetail(item);
            } else {
                try {
                    const response = await fetch(`${serverUrl}/api/donations?search=${encodeURIComponent(itemId)}&limit=1`);
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.data.length > 0) {
                            displayItemDetail(result.data[0]);
                        } else {
                            alert('找不到指定的记录');
                        }
                    }
                } catch (error) {
                    console.error('获取详情错误:', error);
                    alert('获取详情失败');
                }
            }
            document.getElementById('detailModal').style.display = 'block';
        }

        function displayItemDetail(item) {
            const detailContent = document.getElementById('detailContent');
            const formatDate = (dateString) => {
                if (!dateString) return '-';
                return new Date(dateString).toLocaleString('zh-TW');
            };

            detailContent.innerHTML = `
                <div class="detail-row"><div class="detail-label">姓名:</div><div class="detail-value">${item.name || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">护持项目:</div><div class="detail-value">${item.project || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">祈福方式:</div><div class="detail-value" style="white-space: pre-wrap;">${item.method || '-'}</div></div>
                <div class="detail-row">
                    <div class="detail-label">护持金额:</div>
                    <div class="detail-value">
                        <div>新台币: NT$ ${item.amountTWD ? item.amountTWD.toLocaleString() : '0'}</div>
                        <div>人民币: ¥ ${item.amountRMB ? item.amountRMB.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0.00'}</div>
                    </div>
                </div>
                <div class="detail-row"><div class="detail-label">祈福内容:</div><div class="detail-value" style="white-space: pre-wrap;">${item.content || '-'}</div></div>
                <div class="detail-row">
                    <div class="detail-label">缴费状态:</div>
                    <div class="detail-value">
                        <span style="padding: 3px 8px; border-radius: 3px;
                              background-color: ${item.payment === '已缴费' ? '#d4edda' : item.payment === '未缴费' ? '#f8d7da' : '#fff3cd'};
                              color: ${item.payment === '已缴费' ? '#155724' : item.payment === '未缴费' ? '#721c24' : '#856404'}">
                            ${item.payment || '未缴费'}
                        </span>
                    </div>
                </div>
                <div class="detail-row"><div class="detail-label">联系人:</div><div class="detail-value">${item.contact || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">提交时间:</div><div class="detail-value">${formatDate(item.submittedAt)}</div></div>
                <div class="detail-row"><div class="detail-label">创建时间:</div><div class="detail-value">${formatDate(item.createdAt)}</div></div>
                <div class="detail-row"><div class="detail-label">设备ID:</div><div class="detail-value" style="font-family: monospace; font-size: 12px;">${item.deviceId || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">批次ID:</div><div class="detail-value" style="font-family: monospace; font-size: 12px;">${item.batchId || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">本地ID:</div><div class="detail-value" style="font-family: monospace; font-size: 12px;">${item.localId || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">服务器ID:</div><div class="detail-value" style="font-family: monospace; font-size: 12px;">${item._id || '-'}</div></div>
            `;
        }

        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        // ============ 筛选 ============
        function applyFilters() {
            currentFilters = {};
            const search = document.getElementById('searchInput').value.trim();
            const project = document.getElementById('projectFilter').value;
            const payment = document.getElementById('paymentFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (search) currentFilters.search = search;
            if (project) currentFilters.project = project;
            if (payment) currentFilters.payment = payment;
            if (startDate) currentFilters.startDate = startDate;
            if (endDate) currentFilters.endDate = endDate;

            currentPage = 1;
            loadData();
            addLog('应用了新的筛选条件', 'info');
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('projectFilter').value = '';
            document.getElementById('paymentFilter').value = '';
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 30);
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

            currentFilters = {};
            currentPage = 1;
            loadData();
            addLog('清除了所有筛选条件', 'info');
        }

        // ============ 导出 ============
        async function exportCSV() {
            try {
                const response = await fetch(`${serverUrl}/api/export/csv`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0,10).replace(/-/g, '');
                a.href = url;
                a.download = `护持数据_${timestamp}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                addLog('导出了CSV文件', 'success');
            } catch (error) {
                console.error('导出CSV错误:', error);
                alert('导出失败: ' + error.message);
                addLog(`导出CSV失败: ${error.message}`, 'error');
            }
        }

        function exportJSON() {
            const dataStr = JSON.stringify(currentData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const timestamp = new Date().toISOString().slice(0,10).replace(/-/g, '');
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', `护持数据_${timestamp}.json`);
            linkElement.click();
            addLog('导出了JSON文件', 'success');
        }

        function backToForm() { window.location.href = '/'; }

        // ============ 加载状态 ============
        function showTableLoading() {
            document.getElementById('tableLoading').style.display = 'block';
            document.getElementById('donationTable').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
        }

        function hideTableLoading() {
            document.getElementById('tableLoading').style.display = 'none';
        }

        function showTableError(message) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="11" style="text-align: center; padding: 20px; color: #dc3545;">
                        <i class="fas fa-exclamation-circle"></i> ${message}
                    </td>
                </tr>
            `;
            document.getElementById('donationTable').style.display = 'table';
            document.getElementById('tableLoading').style.display = 'none';
        }

        // ============ 日志 ============
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContent.prepend(logEntry);
            while (logContent.children.length > 50) {
                logContent.removeChild(logContent.lastChild);
            }
        }

        // ============ 删除 ============
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        async function confirmDelete() {
            const password = getAdminPassword();
            if (!password) {
                alert('会话已过期，请重新登录');
                return;
            }

            const itemId = document.getElementById('deleteModal').getAttribute('data-id');
            try {
                const response = await fetch(`${serverUrl}/api/donations/${itemId}?adminPassword=${encodeURIComponent(password)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.success) {
                    alert(`成功删除 ${result.deletedCount} 条记录`);
                    closeDeleteModal();
                    loadData();
                    loadStats();
                    addLog(`删除了记录 (ID: ${itemId})`, 'warning');
                } else {
                    throw new Error(result.error || '删除失败');
                }
            } catch (error) {
                console.error('删除错误:', error);
                alert('删除失败: ' + error.message);
                addLog(`删除失败: ${error.message}`, 'error');
            }
        }

        // ============ 活动项目维护 ============
        async function openConfigEditor() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                const cfg = data.config || { exchangeRate: 4.2, projects: {} };
                delete cfg._id;
                delete cfg.updatedAt;
                document.getElementById('configEditor').value = JSON.stringify(cfg, null, 2);
                document.getElementById('configEditorMsg').textContent = '';
                document.getElementById('configEditorModal').style.display = 'block';
            } catch (e) {
                alert('加载配置失败: ' + e.message);
            }
        }

        function closeConfigEditor() {
            document.getElementById('configEditorModal').style.display = 'none';
        }

        async function saveConfigEditor() {
            const msgEl = document.getElementById('configEditorMsg');
            msgEl.textContent = '';
            msgEl.style.color = '#dc3545';

            let configData;
            try {
                configData = JSON.parse(document.getElementById('configEditor').value);
            } catch (e) {
                msgEl.textContent = 'JSON格式错误: ' + e.message;
                return;
            }

            const pwd = getAdminPassword();
            if (!pwd) {
                msgEl.textContent = '会话已过期，请重新登录';
                return;
            }

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: pwd, configData })
                });
                const data = await res.json();
                if (data.success) {
                    msgEl.style.color = '#28a745';
                    msgEl.textContent = '✅ 配置已保存';
                    addLog('活动项目配置已更新', 'success');
                    setTimeout(() => {
                        closeConfigEditor();
                        initializePage();
                    }, 800);
                } else {
                    msgEl.textContent = data.error || '保存失败';
                }
            } catch (e) {
                msgEl.textContent = '保存失败: ' + e.message;
            }
        }
    </script>
